name: Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-test.yml']
concurrency:
  group: locatebase-android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://manchester-city-backend.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - working-directory: mobile
        run: npm ci --include=dev
      - name: Verify production API and Firebase configuration
        working-directory: mobile
        run: |
          node -e "const fs=require('node:fs');const env=fs.readFileSync('.env.production','utf8');for(const key of ['EXPO_PUBLIC_FIREBASE_API_KEY','EXPO_PUBLIC_FIREBASE_PROJECT_ID','EXPO_PUBLIC_FIREBASE_APP_ID'])if(!new RegExp('^'+key+'=.+','m').test(env))throw Error('Missing '+key+' in .env.production');"
          node -e "if(!process.env.EXPO_PUBLIC_API_URL?.startsWith('https://manchester-city-backend.onrender.com'))process.exit(1)"
      - name: Reject obsolete LocateBase API addresses
        working-directory: mobile
        run: |
          if grep -R -n --include='*.ts' --include='*.tsx' --include='*.js' --include='.env.production' \
            'locatebase-api.onrender.com' src services config .env.production; then
            echo "::error::Obsolete API hostname detected. The APK must use manchester-city-backend.onrender.com."
            exit 1
          fi
          echo "Production API: $EXPO_PUBLIC_API_URL"
      - working-directory: mobile
        run: npm run typecheck
      - name: Build installable test APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LocateBase-Android-Connected-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
